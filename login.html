<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Vinox — Sign In</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<meta name="theme-color" content="#0B0716">

<style>
:root{
  --vx-bg:#0B0716;
  --vx-card:rgba(255,255,255,0.03);
  --vx-line:rgba(168,132,255,0.14);
  --vx-line-2:rgba(168,132,255,0.28);
  --vx-text:#F3EEFF;
  --vx-muted:#9A8FB8;
  --vx-violet:#A855F7;
  --vx-gold:#F5C86B;
  --vx-danger:#FF5C7A;
}
html,body{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;background:var(--vx-bg);color:var(--vx-text)}
*,*::before,*::after{box-sizing:inherit}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
@keyframes vxSpin{to{transform:rotate(360deg)}}

/* simple background */
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(700px 400px at 15% -5%,rgba(168,85,247,0.14),transparent 60%),
    radial-gradient(700px 400px at 100% 100%,rgba(245,200,107,0.08),transparent 60%),
    #0B0716}

/* shell */
.vx-shell{width:100%;max-width:420px;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:32px 22px 32px}

/* brand text only */
.vx-brand{font-size:22px;font-weight:800;letter-spacing:-0.5px;color:var(--vx-text);margin-bottom:36px;text-align:center}
.vx-brand span{color:var(--vx-gold)}

/* heading */
.vx-heading{margin-bottom:28px}
.vx-heading h1{font-size:24px;font-weight:700;letter-spacing:-0.6px;margin:0 0 6px;color:var(--vx-text)}
.vx-heading p{font-size:13px;color:var(--vx-muted);margin:0;line-height:1.5}

/* fields */
.vx-field{position:relative;margin-bottom:14px}
.vx-field input{width:100%;height:52px;padding:0 44px 0 16px;background:var(--vx-card);border:1px solid var(--vx-line);border-radius:10px;font-family:'Manrope';font-size:14px;font-weight:500;color:var(--vx-text);outline:none;transition:border-color .2s}
.vx-field input::placeholder{color:var(--vx-muted)}
.vx-field input:focus{border-color:var(--vx-violet);background:rgba(255,255,255,0.05)}
.vx-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--vx-muted);cursor:pointer;padding:8px;font-size:1.1rem;border-radius:8px}
.vx-eye:hover{color:var(--vx-violet)}

/* forgot */
.vx-forgot{display:flex;justify-content:flex-end;margin:-4px 2px 20px}
.vx-forgot a{font-size:12px;font-weight:600;color:var(--vx-gold);text-decoration:none}
.vx-forgot a:hover{text-decoration:underline}

/* plain button */
.vx-btn{width:100%;height:52px;border:none;border-radius:10px;background:var(--vx-violet);color:#fff;font-family:'Manrope';font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.vx-btn:hover:not(:disabled){background:#9333EA}
.vx-btn:disabled{opacity:.6;cursor:not-allowed}
.vx-spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:vxSpin .7s linear infinite;display:inline-block}

/* signup text link */
.vx-signup{text-align:center;margin-top:22px;font-size:13px;color:var(--vx-muted)}
.vx-signup a{color:var(--vx-gold);font-weight:700;text-decoration:none}
.vx-signup a:hover{text-decoration:underline}

/* footer */
.vx-foot{margin-top:auto;padding-top:24px;text-align:center;font-size:11px;color:#6E6390}

/* top-left modal */
#vx-modal-layer{position:fixed;top:14px;left:14px;z-index:99999;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;max-width:min(320px,calc(100vw - 28px))}
.vx-modal{position:relative;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;background:#171029;border:1px solid var(--vx-line-2);box-shadow:0 10px 28px rgba(0,0,0,0.5);pointer-events:auto;cursor:pointer;overflow:hidden;transform:translateX(-24px);opacity:0;transition:transform .3s ease,opacity .25s ease}
.vx-modal.show{transform:none;opacity:1}
.vx-modal .m-ico{font-size:18px;color:var(--c);flex-shrink:0;padding-top:1px}
.vx-modal .m-body{flex:1;min-width:0}
.vx-modal .m-title{font-size:10px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--c);margin-bottom:2px}
.vx-modal .m-msg{font-size:12px;font-weight:500;color:var(--vx-text);line-height:1.4}
.vx-modal .m-bar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--c);opacity:.8;transform-origin:left;animation:vxBar 4.4s linear forwards}
@keyframes vxBar{to{transform:scaleX(0)}}
</style>
</head>
<body>

<main class="vx-shell">

  <div class="vx-brand">Vinox<span>.</span></div>

  <div class="vx-heading">
    <h1>Sign in</h1>
    <p>Welcome back. Enter your details to continue.</p>
  </div>

  <form id="vxLoginForm" autocomplete="off" novalidate>

    <div class="vx-field">
      <input type="email" id="email" placeholder="Email address" required autocomplete="email">
    </div>

    <div class="vx-field">
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
      <button type="button" class="vx-eye" id="vxEye" aria-label="Show or hide password"><i class="ph ph-eye"></i></button>
    </div>

    <div class="vx-forgot"><a href="forgot-password.html">Forgot password?</a></div>

    <button type="submit" class="vx-btn" id="vxLoginBtn">
      <span id="vxBtnText">Sign In</span>
    </button>

  </form>

  <div class="vx-signup">Don't have an account? <a href="index.html">Sign up</a></div>

  <div class="vx-foot">© Vinox</div>

</main>

<div id="vx-modal-layer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJaVOCaeTJR4gkct1vKwrO3pbdZk1bXoQ",
  authDomain: "vinox-35d0d.firebaseapp.com",
  projectId: "vinox-35d0d",
  storageBucket: "vinox-35d0d.firebasestorage.app",
  messagingSenderId: "300010165609",
  appId: "1:300010165609:web:594b8652dce6a8ca1259f8"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

// top-left modal
const MODAL_THEMES = {
  success:{icon:'ph-check-circle',color:'#4ADE80',title:'Success'},
  error:{icon:'ph-x-circle',color:'#FF5C7A',title:'Error'},
  warning:{icon:'ph-warning-circle',color:'#F5C86B',title:'Notice'},
  info:{icon:'ph-info',color:'#A855F7',title:'Info'}
};
function vxModal(type, message, title){
  const layer = $('vx-modal-layer');
  const th = MODAL_THEMES[type] || MODAL_THEMES.info;
  while(layer.children.length >= 3) layer.firstChild.remove();
  const m = document.createElement('div');
  m.className = 'vx-modal';
  m.style.setProperty('--c', th.color);
  m.innerHTML = `
    <div class="m-ico"><i class="ph ${th.icon}"></i></div>
    <div class="m-body">
      <div class="m-title">${title || th.title}</div>
      <div class="m-msg"></div>
    </div>
    <span class="m-bar"></span>`;
  m.querySelector('.m-msg').textContent = message;
  const kill = () => { m.classList.remove('show'); setTimeout(() => m.remove(), 300); };
  m.addEventListener('click', kill);
  layer.appendChild(m);
  requestAnimationFrame(() => m.classList.add('show'));
  setTimeout(kill, 4400);
}

// eye
$('vxEye').addEventListener('click', () => {
  const inp = $('password'), ic = $('vxEye').querySelector('i');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  ic.className = show ? 'ph ph-eye-slash' : 'ph ph-eye';
});

// login
let submitting = false;
function setLoading(l){
  submitting = l;
  $('vxLoginBtn').disabled = l;
  $('vxBtnText').innerHTML = l ? '<span class="vx-spinner"></span> Signing in…' : 'Sign In';
}

async function handleLogin(){
  if(submitting) return;
  const email = $('email').value.trim().toLowerCase();
  const password = $('password').value;

  if(!email || !password) return vxModal('warning','Enter your email and password.','Missing Info');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return vxModal('error','Enter a valid email address.');

  setLoading(true);
  try{
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const uid = cred.user.uid;

    const uidSnap = await getDoc(doc(db,'usersByUid',uid));
    if(!uidSnap.exists()){ setLoading(false); return vxModal('error','Profile not found.','Login Failed'); }

    const username = uidSnap.data().username;
    const userSnap = await getDoc(doc(db,'users',username));
    if(!userSnap.exists()){ setLoading(false); return vxModal('error','Account data missing.','Login Failed'); }
    const u = userSnap.data();

    try{ await updateDoc(doc(db,'users',username), { lastLogin: serverTimestamp() }); }catch(e){}

    sessionStorage.setItem('userLoggedIn','true');
    sessionStorage.setItem('userEmail', email);
    sessionStorage.setItem('userUid', uid);
    sessionStorage.setItem('username', username);
    sessionStorage.setItem('userData', JSON.stringify({
      username,
      email: u.email || email,
      depositWallet: u.depositWallet ?? 0,
      withdrawalWallet: u.withdrawalWallet ?? 0,
      totalDeposited: u.totalDeposited ?? 0,
      totalWithdrawn: u.totalWithdrawn ?? 0,
      referralCount: u.referralCount ?? 0,
      referralBonus: u.referralBonus ?? 0,
      activePlan: u.activePlan || '',
      isAdmin: !!u.isAdmin
    }));

    vxModal('success', `Welcome back, ${username}!`, 'Signed In');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1300);

  }catch(err){
    setLoading(false);
    const messages = {
      'auth/invalid-credential':'Incorrect email or password.',
      'auth/user-not-found':'No account found with that email.',
      'auth/wrong-password':'Incorrect password.',
      'auth/invalid-email':'That email address looks invalid.',
      'auth/too-many-requests':'Too many attempts. Try again later.',
      'auth/network-request-failed':'Network error. Check your connection.',
      'permission-denied':'Could not load your account.'
    };
    vxModal('error', messages[err.code] || 'Login failed. Please try again.');
  }
}

$('vxLoginForm').addEventListener('submit', e => { e.preventDefault(); handleLogin(); });
</script>
</body>
</html>
